name: Keep alive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping en boucle (~5 min) pendant toute la durée du job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          END=$((SECONDS + 340*60))
          while [ $SECONDS -lt $END ]; do
            curl -fsS -o /dev/null -w "$(date -u +%H:%M:%S) gotaxii.com Status: %{http_code}\n" https://gotaxii.com || true

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              "$SUPABASE_URL/rest/v1/reservations?select=id&limit=1")
            echo "$(date -u +%H:%M:%S) Statut Supabase DB : $STATUS"

            sleep 300
          done
